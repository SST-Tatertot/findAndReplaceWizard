        :root {
            --gc-blue: #26374A;
            --gc-blue-dark: #1C2B39;
            --gc-red: #EB2D37;
            --gc-red-dark: #C81E28;
            --gc-text: #333333;
            --gc-bg: #dfdede;
            --gc-white: #ffffff;
            --gc-border: #CCCCCC;
            --radius: 4px;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans', Arial, sans-serif;
            font-size: 18px;
            line-height: 1.5;
            color: var(--gc-text);
            background-color: var(--gc-bg);
            margin: 0;
            padding: 0;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 1rem;
            background-color: var(--gc-blue);
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            min-height: 64px;
        }
        nav img { height: 36px; width: auto; }
        nav .title {
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: #ffffff;
            margin-right: auto;
        }
        #lang {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #ffffff;
            border-radius: var(--radius);
            padding: 0.4rem 1rem;
            font-family: 'Noto Sans', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        #lang:hover { background-color: rgba(255, 255, 255, 0.15); border-color: #ffffff; }
        .main {
            max-width: 760px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
        }
        .content { text-align: center; }

        /* Drag & Drop Zone */
        .dropzone {
            border: 2px dashed var(--gc-border);
            border-radius: var(--radius);
            padding: 2rem 1.5rem;
            background-color: #f7f7f7;
            transition: all 0.2s ease;
            margin-bottom: 1.2rem;
            cursor: pointer;
        }
        .dropzone.drag-active {
            border-color: var(--gc-red);
            background-color: #fff5f5;
            transform: scale(1.01);
        }
        .cover {
            display: inline-block;
            background-color: var(--gc-white);
            color: var(--gc-text);
            border: 2px solid var(--gc-blue);
            border-radius: var(--radius);
            padding: 0.85rem 2rem;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .cover:hover {
            background-color: var(--gc-blue);
            color: #ffffff;
        }
        input[type="file"] { display: none; }
        .drag-prompt {
            font-size: 0.85rem;
            color: #666666;
            margin-top: 0.6rem;
            margin-bottom: 0;
        }

        /* Formatter Checkbox */
        .option-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 0 auto 1.5rem;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
            max-width: 500px;
            text-align: left;
            background: var(--gc-white);
            padding: 0.6rem 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--gc-border);
        }
        .option-box input {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        /* Action Button */
        button#processFiles {
            background-color: var(--gc-red);
            color: #ffffff;
            border: none;
            border-radius: var(--radius);
            padding: 0.9rem 2.8rem;
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        button#processFiles:hover { background-color: var(--gc-red-dark); }

        /* Selected Files List */
        .selected {
            display: none;
            list-style: none;
            padding: 0.5rem;
            margin: 1rem auto 1.5rem;
            max-width: 400px;
            text-align: left;
            background: var(--gc-white);
            border: 1px solid var(--gc-border);
            border-radius: var(--radius);
            max-height: 150px;
            overflow-y: auto;
        }
        .selected li {
            padding: 0.35rem 0.5rem;
            font-size: 0.9rem;
            border-bottom: 1px solid #eeeeee;
        }
        .selected li:last-child { border-bottom: none; }

        /* Download Links */
        #downloadLinks {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--gc-border);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }
        #downloadLinks a {
            display: inline-block;
            background-color: var(--gc-blue);
            color: #ffffff;
            text-decoration: none;
            border-radius: var(--radius);
            padding: 0.7rem 1.4rem;
            font-size: 1rem;

        .bobbing-image {
            display: block;
            margin: 3rem auto 0;
            opacity: 0.9;
            max-width: 440px;
            width: 100%;
            pointer-events: none;
        }
    </style>
</head>

        // Safe Regex Helpers
        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function buildPattern(find) {
            const escaped = escapeRegExp(find);
            const startsWithWord = /^[\wÀ-ÿ]/.test(find);
            const endsWithWord = /[\wÀ-ÿ]$/.test(find);
            return `${startsWithWord ? '\\b' : ''}${escaped}${endsWithWord ? '\\b' : ''}`;
        }

        // HTML Single-Tab Formatter
        function formatHtmlWithTabs(html) {
            let text = html.replace(/[ ]{2,}/g, ' ');

            const voidTags = /^(?:area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;
            const inlineTags = /^(?:abbr|a|b|i|em|strong|span|sub|sup|code|small|mark|time|cite|q|u|s|dfn|kbd|samp|var)$/i;

            const tokens = text.split(/(<[^>]+>)/g).filter(Boolean);
            let indent = 0;
            const tab = '\t';
            const lines = [];
            let currentLine = '';
            let rawTag = null;

            for (let i = 0; i < tokens.length; i++) {
                const token = tokens[i];
                const isTag = token.startsWith('<') && token.endsWith('>');

                if (rawTag) {
                    if (isTag && token.toLowerCase().startsWith(`</${rawTag}`)) {
                        if (currentLine.length > 0) {
                            lines.push(currentLine);
                            currentLine = '';
                        }
                        rawTag = null;
                        indent = Math.max(0, indent - 1);
                        lines.push(tab.repeat(indent) + token);
                    } else {
                        currentLine += token;
                    }
                    continue;
                }

                if (isTag) {
                    if (token.startsWith('<!DOCTYPE') || token.startsWith('<!doctype') || token.startsWith('<!--')) {
                        if (currentLine.trim().length > 0) {
                            lines.push(currentLine);
                            currentLine = '';
                        }
                        lines.push(token);
                        continue;
                    }

                    const isClosing = token.startsWith('</');
                    const tagMatch = token.match(/<\/?([a-zA-Z0-9!_-]+)/);
                    const tagName = tagMatch ? tagMatch[1].toLowerCase() : '';
                    const isVoid = voidTags.test(tagName) || token.endsWith('/>');
                    const isInline = inlineTags.test(tagName);

                    if (isInline) {
                        currentLine += token;
                    } else if (isClosing) {
                        indent = Math.max(0, indent - 1);
                        if (currentLine.trim().length > 0) {
                            currentLine += token;
                            lines.push(currentLine);
                            currentLine = '';
                        } else {
                            lines.push(tab.repeat(indent) + token);
                        }
                    } else if (isVoid) {
                        if (currentLine.trim().length > 0) {
                            lines.push(currentLine);
                            currentLine = '';
                        }
                        lines.push(tab.repeat(indent) + token);
                    } else {
                        if (tagName === 'style' || tagName === 'script' || tagName === 'pre' || tagName === 'textarea') {
                            rawTag = tagName;
                        }
                        if (currentLine.trim().length > 0) {
                            lines.push(currentLine);
                            currentLine = '';
                        }
                        currentLine = tab.repeat(indent) + token;
                        indent++;
                    }
                } else {
                    const cleanText = token.replace(/\r?\n|\r/g, ' ').replace(/[ ]{2,}/g, ' ');
                    if (cleanText.trim().length > 0) {
                        currentLine += cleanText;
                    }
                }
            }

            if (currentLine.trim().length > 0) {
                lines.push(currentLine);
            }

            return lines.join('\n').replace(/[ ]{2,}/g, ' ');
        }

        // File Selection & Drag-and-Drop
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');

        function updateSelectedList() {
            const selectedList = document.querySelector('.selected');
            selectedList.innerHTML = '';
            if (filesQueue.length > 0) {
                selectedList.style.display = 'block';
                filesQueue.forEach(file => {
                    const li = document.createElement('li');
                    li.textContent = file.name;
                    selectedList.appendChild(li);
                });
            } else {
                selectedList.style.display = 'none';
            }
        }

        fileInput.addEventListener('change', (e) => {
            filesQueue = Array.from(e.target.files);
            updateSelectedList();
        });

        // Drag events
        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropzone.classList.add('drag-active');
                document.getElementById('dragPrompt').textContent = ui[currentLang].dragActive;
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropzone.classList.remove('drag-active');
                document.getElementById('dragPrompt').textContent = ui[currentLang].dragPrompt;
            }, false);
        });

        dropzone.addEventListener('drop', (e) => {
            const droppedFiles = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.html') || f.name.endsWith('.htm'));
            if (droppedFiles.length > 0) {
                filesQueue = droppedFiles;
                updateSelectedList();
            }
        });

        // Processing & Download
        document.getElementById('processFiles').addEventListener('click', () => {
            if (!filesQueue.length) {
                alert(ui[currentLang].alert);
                return;
            }

            const downloadLinks = document.getElementById('downloadLinks');
            downloadLinks.innerHTML = '';

            const shouldFormat = document.getElementById('formatHtmlCheckbox').checked;
            const replacements = currentLang === 'en' ? enReplacements : frReplacements;
            const dateRegex = /\b([A-Za-zÀ-ÿ]+) (\d{1,2}), (\d{4})\b/g;

            filesQueue.forEach((file) => {
                const reader = new FileReader();

                reader.onload = function (event) {
                    let content = event.target.result;

                    // 1. Collapse multiple spaces
                    content = content.replace(/[ ]{2,}/g, ' ');

                    // 2. Safely apply replacements
                    replacements.forEach(({ find, replace }) => {
                        const regex = new RegExp(buildPattern(find), 'g');
                        content = content.replace(regex, replace);
                    });

                    // 3. Format dates
                    content = content.replace(dateRegex, (match, month, day, year) => {
                        return `${month}&nbsp;${day},&nbsp;${year}`;
                    });

                    // 4. Format HTML with single tab margins
                    if (shouldFormat) {
                        content = formatHtmlWithTabs(content);
                    }

                    const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);

                    const link = document.createElement('a');
                    link.href = url;
                    link.download = file.name;
                    link.textContent = '⬇ ' + file.name;
                    downloadLinks.appendChild(link);
                };

                reader.readAsText(file);
            });
        });
    </script>
</body>
</html>
